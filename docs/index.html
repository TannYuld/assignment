nk that this course is perfect match for me.</h3><p data-heml-scope="IVWUOKJKWG" class="text-block"> I do indeed LOVE working with computers. I use computers since 4 years old and I code since 9 years old. Altough that was more of a basic "lets teach kids how to code" thing with drag-and-drop blocks. Not text based, not advanced. Since then I love programming because, solving problems and bugs feels better than eathing chocolate. <span data-heml-scope="IVWUOKJKWG" class="alt-text">(It gives a better euphoria effect on my brain.)</span><br data-heml-scope="IVWUOKJKWG"/><br data-heml-scope="IVWUOKJKWG"/> I eventualy want to go to the university, learn about computer architecture. To be able to make my own physical basic 16-bit CPU at home from only real-life NAND gates. And flex my mom about it. 😎 </p><div style="width: 50rem;" class="vertical-space" data-heml-scope="IVWUOKJKWG"><div class="divider" data-heml-scope="IVWUOKJKWG"></div></div><h3 data-heml-scope="IVWUOKJKWG">Some programming languages I know.</h3><ol data-heml-scope="IVWUOKJKWG"><li data-heml-scope="IVWUOKJKWG">❤️ Rust ❤️</li><li data-heml-scope="IVWUOKJKWG">Java</li><li data-heml-scope="IVWUOKJKWG">Javascript / Typescript</li><li data-heml-scope="IVWUOKJKWG">C#</li><li data-heml-scope="IVWUOKJKWG">Python</li><li data-heml-scope="IVWUOKJKWG">C</li><li data-heml-scope="IVWUOKJKWG">C++</li></ol><span data-heml-scope="IVWUOKJKWG" class="alt-text"> Well some of them aren't even actual programming language in my opinion... </span><p data-heml-scope="IVWUOKJKWG" class="text-block"> This list goes from the one's I have most knowledge to the ones that I only am famillier with their abstract concept. For example Cpp was the one of the first text based languages I have learned. But I last used it almost 9 years ago </p><div style="width: 50rem;" class="vertical-space" data-heml-scope="IVWUOKJKWG"><div class="divider" data-heml-scope="IVWUOKJKWG"></div></div><h3 data-heml-scope="IVWUOKJKWG">Two of my most recent pr

nk that this course is perfect match for me.</h3><p data-heml-scope="FFKJVYQBWG" class="text-block"> I do indeed LOVE working with computers. I use computers since 4 years old and I code since 9 years old. Altough that was more of a basic "lets teach kids how to code" thing with drag-and-drop blocks. Not text based, not advanced. Since then I love programming because, solving problems and bugs feels better than eathing chocolate. <span class="alt-text" data-heml-scope="FFKJVYQBWG">(It gives a better euphoria effect on my brain.)</span><br data-heml-scope="FFKJVYQBWG"/><br data-heml-scope="FFKJVYQBWG"/> I eventualy want to go to the university, learn about computer architecture. To be able to make my own physical basic 16-bit CPU at home from only real-life NAND gates. And flex my mom about it. 😎 </p><div class="vertical-space" data-heml-scope="FFKJVYQBWG" style="width: 50rem;"><div class="divider" data-heml-scope="FFKJVYQBWG"></div></div><h3 data-heml-scope="FFKJVYQBWG">Some programming languages I know.</h3><ol data-heml-scope="FFKJVYQBWG"><li data-heml-scope="FFKJVYQBWG">❤️ Rust ❤️</li><li data-heml-scope="FFKJVYQBWG">Java</li><li data-heml-scope="FFKJVYQBWG">Javascript / Typescript</li><li data-heml-scope="FFKJVYQBWG">C#</li><li data-heml-scope="FFKJVYQBWG">Python</li><li data-heml-scope="FFKJVYQBWG">C</li><li data-heml-scope="FFKJVYQBWG">C++</li></ol><span class="alt-text" data-heml-scope="FFKJVYQBWG"> Well some of them aren't even actual programming language in my opinion... </span><p class="text-block" data-heml-scope="FFKJVYQBWG"> This list goes from the one's I have most knowledge to the ones that I only am famillier with their abstract concept. For example Cpp was the one of the first text based languages I have learned. But I last used it almost 9 years ago </p><div data-heml-scope="FFKJVYQBWG" class="vertical-space" style="width: 50rem;"><div data-heml-scope="FFKJVYQBWG" class="divider"></div></div><h3 data-heml-scope="FFKJVYQBWG">Two of my most recent pr
